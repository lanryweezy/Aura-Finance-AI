services:
  # Backend API Service
  - type: web
    name: aura-finance-backend
    env: python
    region: oregon
    buildCommand: |
      cd backend && 
      pip install --upgrade pip &&
      pip install -r requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PORT
        value: 8000
      - key: ENVIRONMENT
        value: production
      - key: PAYSTACK_PUBLIC_KEY
        sync: false  # Set this manually in Render dashboard
      - key: PAYSTACK_SECRET_KEY
        sync: false  # Set this manually in Render dashboard
      - key: GEMINI_API_KEY
        sync: false # Set this manually in Render dashboard
    autoDeploy: false
    disk:
      name: backend-disk
      mountPath: /opt/render/project/backend/data
      sizeGB: 1

  # Frontend Service  
  - type: web
    name: aura-finance-frontend
    env: node
    region: oregon
    buildCommand: |
      npm ci &&
      npm run build
    startCommand: npm run preview -- --port $PORT --host 0.0.0.0
    envVars:
      - key: NODE_VERSION
        value: 18.17.0
      - key: PORT
        value: 3000
      - key: VITE_API_URL
        fromService:
          type: web
          name: aura-finance-backend
          property: host
      - key: VITE_GEMINI_API_KEY
        sync: false  # Set this manually in Render dashboard
      - key: PAYSTACK_PUBLIC_KEY
        sync: false  # Set this manually in Render dashboard
    autoDeploy: false

databases:
  - name: aura-finance-db
    databaseName: aura_finance
    user: aura_user
    region: oregon